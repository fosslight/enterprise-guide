name: Build and deploy Enterprise Guide

on:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    # Refresh Hub Guide content every day at 00:00 UTC (09:00 KST).
    - cron: "0 0 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Enterprise Guide
        uses: actions/checkout@v6

      - name: Checkout Hub Guide
        uses: actions/checkout@v6
        with:
          repository: fosslight/hub-guide
          path: _external/hub-guide

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Synchronize Hub Guide content
        run: python scripts/sync_hub_sent_mail.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
